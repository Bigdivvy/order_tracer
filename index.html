  .sky::after{content:"";position:absolute;inset:0;
    background:linear-gradient(180deg,rgba(10,20,35,0.12) 0%,rgba(10,20,35,0.28) 60%,rgba(10,20,35,0.42) 100%);}
  .wrap{max-width:720px;margin:0 auto;padding:18px 16px 70px;}
  nav{display:flex;justify-content:space-between;align-items:center;background:var(--glass);
    backdrop-filter:blur(26px) saturate(140%);-webkit-backdrop-filter:blur(26px) saturate(140%);
    border:1px solid var(--glass-brd);border-radius:16px;padding:12px 18px;margin-bottom:22px;
    box-shadow:0 8px 28px rgba(10,20,35,0.12);}
  nav .logo{font-weight:700;font-size:16px;color:#fff;text-shadow:0 1px 6px rgba(0,0,0,0.55);letter-spacing:0.01em;}
  nav .links{display:flex;gap:18px;font-size:13px;color:#fff;text-shadow:0 1px 4px rgba(0,0,0,0.5);opacity:0.9;}
  .glass{background:var(--glass);backdrop-filter:blur(26px) saturate(140%);-webkit-backdrop-filter:blur(26px) saturate(140%);
    border:1px solid var(--glass-brd);border-radius:18px;padding:22px;margin-bottom:16px;
    box-shadow:0 8px 28px rgba(10,20,35,0.14);}
  h1.page-title{font-size:26px;font-weight:700;text-align:center;margin:4px 0 4px;color:#fff;text-shadow:0 2px 10px rgba(0,0,0,0.5);letter-spacing:-0.01em;}
  p.page-sub{text-align:center;color:#fff;opacity:0.88;text-shadow:0 1px 6px rgba(0,0,0,0.45);font-size:13px;margin:0 0 22px;}
  .field-row{display:flex;gap:14px;flex-wrap:wrap;margin-bottom:14px;}
  .field{flex:1;min-width:180px;}
  .field label{display:block;font-size:12px;color:var(--ink-dim);margin-bottom:6px;}
  .field input,.field select,.field textarea{width:100%;padding:10px 12px;border-radius:10px;border:1px solid rgba(20,50,90,0.18);
    background:rgba(255,255,255,0.65);font-size:13px;font-family:inherit;color:var(--ink);}
  .field textarea{min-height:90px;resize:vertical;font-family:'IBM Plex Mono',monospace;font-size:12px;}
  .btn{width:100%;padding:11px;border:none;border-radius:10px;background:var(--accent);color:#fff;
    font-weight:500;font-size:14px;cursor:pointer;font-family:inherit;}
  .btn.secondary{background:rgba(255,255,255,0.5);color:var(--ink);border:1px solid rgba(20,50,90,0.2);}
  .order-head{display:flex;justify-content:space-between;align-items:flex-start;gap:12px;flex-wrap:wrap;}
  .order-head h2{margin:0 0 4px;font-size:18px;display:flex;align-items:center;gap:10px;flex-wrap:wrap;}
  .pill{font-size:11px;padding:3px 10px;border-radius:20px;font-weight:500;}
  .pill.current{background:rgba(193,122,30,0.18);color:var(--current);}
  .pill.good{background:rgba(47,143,91,0.18);color:var(--good);}
  .order-head .placed{color:var(--ink-dim);font-size:13px;margin:0;}
  .head-actions{display:flex;gap:8px;}
  .head-actions button{font-size:12px;padding:8px 12px;border-radius:9px;border:1px solid rgba(20,50,90,0.2);
    background:rgba(255,255,255,0.5);font-family:inherit;color:var(--ink);cursor:pointer;}
  .steps{display:flex;justify-content:space-between;margin-top:26px;position:relative;}
  .steps::before{content:"";position:absolute;top:14px;left:5%;right:5%;height:2px;background:rgba(20,50,90,0.18);}
  .steps .fill{position:absolute;top:14px;left:5%;height:2px;background:var(--accent);width:0%;transition:width .6s ease;}
  .step{position:relative;flex:1;text-align:center;font-size:12px;color:var(--ink-dim);}
  .step .dot{width:28px;height:28px;border-radius:50%;background:#fff;border:2px solid var(--accent);
    display:flex;align-items:center;justify-content:center;margin:0 auto 8px;font-size:13px;color:var(--accent);position:relative;z-index:1;}
  .step.pending .dot{border-color:rgba(20,50,90,0.25);color:rgba(20,50,90,0.3);}
  .step .lbl{color:var(--ink);font-weight:500;}
  .step .dt{display:block;margin-top:2px;}
  .timeline{margin-top:4px;}
  .t-item{display:flex;gap:14px;padding:4px 0 20px;position:relative;}
  .t-item::before{content:"";position:absolute;left:11px;top:26px;bottom:0;width:2px;background:rgba(20,50,90,0.15);}
  .t-item:last-child::before{display:none;}
  .t-dot{width:24px;height:24px;border-radius:50%;background:var(--good);color:#fff;font-size:12px;
    display:flex;align-items:center;justify-content:center;flex-shrink:0;}
  .t-title{font-weight:500;font-size:14px;display:flex;align-items:center;gap:8px;flex-wrap:wrap;}
  .t-desc{font-size:13px;color:var(--ink-dim);margin:2px 0;}
  .t-time{font-size:12px;color:var(--ink-dim);font-family:'IBM Plex Mono',monospace;}
  .two-col{display:flex;gap:20px;flex-wrap:wrap;}
  .two-col > div{flex:1;min-width:150px;}
  .label{font-size:11px;color:var(--ink-dim);margin:0 0 4px;}
  .val{font-size:14px;margin:0 0 14px;}
  .carrier{display:flex;align-items:center;gap:10px;margin-bottom:14px;font-size:14px;font-weight:500;}
  .item-row{display:flex;gap:14px;align-items:center;padding:12px 0;border-top:1px solid rgba(20,50,90,0.12);}
  .item-row:first-of-type{border-top:none;}
  .item-thumb{width:46px;height:46px;border-radius:10px;flex-shrink:0;background:linear-gradient(135deg,#9FC6E8,#4A7FBB);}
  .item-name{font-size:14px;font-weight:500;margin:0 0 2px;}
  .item-meta{font-size:12px;color:var(--ink-dim);margin:0;}
  .item-price{margin-left:auto;text-align:right;font-size:13px;font-weight:500;white-space:nowrap;}
  .order-total{display:flex;justify-content:space-between;padding-top:12px;margin-top:4px;
    border-top:1px solid rgba(20,50,90,0.18);font-size:13px;color:var(--ink-dim);}
  .addr-name{font-weight:500;font-size:14px;margin:0 0 4px;}
  .addr-line{font-size:13px;color:var(--ink-dim);line-height:1.6;margin:0;}
  .help{text-align:center;}
  .help h3{margin:0 0 4px;font-size:16px;}
  .help p{color:var(--ink-dim);font-size:13px;margin:0 0 16px;}
  .help-btns{display:flex;gap:10px;justify-content:center;flex-wrap:wrap;}
  .help-btns button{padding:10px 16px;border-radius:10px;font-size:13px;font-family:inherit;cursor:pointer;}
  .help-btns .ghost{background:rgba(255,255,255,0.5);border:1px solid rgba(20,50,90,0.2);color:var(--ink);}
  .help-btns .solid{background:var(--accent);border:none;color:#fff;}
  .admin-note{font-size:12px;color:var(--ink-dim);text-align:center;margin-top:14px;}
  .admin-status{font-size:13px;margin-top:10px;text-align:center;min-height:18px;}
  @media (max-width:480px){.order-head{flex-direction:column;}.steps .lbl{font-size:11px;}}
</style>
</head>
<body>

<div class="sky"></div>

<script type="application/json" id="data">
{
  "trackingNo":"07362226",
  "placedDate":"November 9, 2026",
  "statusText":"Shipped",
  "statusTone":"current",
  "currentStepIndex":2,
  "stepLabels":["Ordered","Confirmed","Shipped","Delivered"],
  "stepDates":["Nov 9","Nov 9","Nov 11","Nov 17"],
  "carrier":"Korea Post (EMS)",
  "lastUpdate":"Package has shipped with Korea Post (EMS) — estimated 5 working days in transit",
  "lastUpdateTime":"Nov 11, 2026",
  "lastLocation":"In transit from origin facility",
  "estimatedDelivery":"November 17, 2026 (5 working days)",
  "timeline":[
    {"time":"Nov 9, 2026","title":"Order Placed","desc":"Your order has been received"},
    {"time":"Nov 10, 2026","title":"Order Confirmed","desc":"Preparing shipment with Korea Post (EMS)"},
    {"time":"Nov 11, 2026","title":"Shipped","desc":"Package has departed with Korea Post (EMS) — estimated 5 working days in transit"}
  ],
  "timelineCurrentLast":true,
  "items":[
    {"name":"Cheque","meta":"Qty: 1","price":"N/A","total":"N/A"}
  ],
  "itemCount":"1 item",
  "orderTotal":"Total: $0.00",
  "shippingName":"Alma Rodriguez",
  "shippingAddr":"2610 Regal Wood Dr\nHouston, TX 77038",
  "shippingPhone":"",
  "paymentLabel":"N/A",
  "paymentTotal":"Total paid: $10,000"
}
</script>

<div class="wrap" id="view"></div>

<script>
(function(){
  const dataEl = document.getElementById('data');
  const view = document.getElementById('view');
  let DATA = JSON.parse(dataEl.textContent);
  let artifactApi = null;

  function esc(s){ return (s==null?'':String(s)).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])); }
  function nl2br(s){ return esc(s).replace(/\n/g,'<br>'); }

  function renderTracker(){
    const d = DATA;
    const fillPct = ((d.currentStepIndex+1)/d.stepLabels.length)*100;
    const steps = d.stepLabels.map((lbl,i)=>{
      const done = i<=d.currentStepIndex;
      return `<div class="step ${done?'':'pending'}"><div class="dot">${done?'✓':'○'}</div><span class="lbl">${esc(lbl)}</span><span class="dt">${esc(d.stepDates[i]||'')}</span></div>`;
    }).join('');

    const tItems = d.timeline.map((t,i)=>{
      const isCurrent = d.timelineCurrentLast && i===d.timeline.length-1;
      return `<div class="t-item">
        <div class="t-dot">✓</div>
        <div><div class="t-title">${esc(t.title)} ${isCurrent?'<span class="pill current">Current</span>':''}</div>
        <p class="t-desc">${esc(t.desc)}</p><span class="t-time">${esc(t.time)}</span></div>
      </div>`;
    }).join('');

    const itemRows = d.items.map(it=>`<div class="item-row">
      <div class="item-thumb"></div>
      <div><p class="item-name">${esc(it.name)}</p><p class="item-meta">${esc(it.meta)}</p></div>
      <div class="item-price">${esc(it.price)}<br><span style="color:var(--ink-dim);font-weight:400;">${esc(it.total)}</span></div>
    </div>`).join('');

    const toneClass = d.statusTone==='good' ? 'good' : 'current';

    view.innerHTML = `
    <nav><span class="logo">D-wing Logistics</span><span class="links"><span>Track</span><span>Support</span></span></nav>
    <h1 class="page-title">Track Your Order</h1>
    <p class="page-sub">Enter your order details to check the current status</p>

    <div class="glass">
      <div class="label" style="margin-bottom:12px;font-size:13px;color:var(--ink);font-weight:500;">Find Your Order</div>
      <div class="field-row">
        <div class="field"><label>Order ID</label><input value="${esc(d.trackingNo)}" readonly></div>
      </div>
      <button class="btn" type="button">Track Order</button>
    </div>

    <div class="glass">
      <div class="order-head">
        <div><h2>Order ${esc(d.trackingNo)} <span class="pill ${toneClass}">${esc(d.statusText)}</span></h2>
        <p class="placed">Placed on ${esc(d.placedDate)}</p></div>
        <div class="head-actions"><button>Invoice</button><button>Print</button></div>
      </div>
      <div class="steps"><div class="fill" style="width:${fillPct}%"></div>${steps}</div>
    </div>

    <div class="glass">
      <div class="label" style="margin-bottom:14px;font-size:13px;color:var(--ink);font-weight:500;">Order Timeline</div>
      <div class="timeline">${tItems}</div>
    </div>

    <div class="glass">
      <div class="carrier">🚚 ${esc(d.carrier)} — Tracking #${esc(d.trackingNo)}</div>
      <div class="two-col">
        <div><p class="label">Status</p><p class="val"><span class="pill ${toneClass}">${esc(d.statusText)}</span></p>
        <p class="label">Estimated Delivery</p><p class="val">${esc(d.estimatedDelivery)}</p></div>
        <div><p class="label">Last Update</p><p class="val">${esc(d.lastUpdate)}<br><span class="t-time">${esc(d.lastUpdateTime)}</span></p>
        <p class="label">Last Location</p><p class="val">${esc(d.lastLocation)}</p></div>
      </div>
    </div>

    <div class="glass">
      <div class="label" style="margin-bottom:6px;font-size:13px;color:var(--ink);font-weight:500;">Order Items</div>
      ${itemRows}
      <div class="order-total"><span>${esc(d.itemCount)}</span><span>${esc(d.orderTotal)}</span></div>
    </div>

    <div class="two-col" style="margin-bottom:16px;">
      <div class="glass" style="margin-bottom:0;"><p class="label">Shipping Address</p>
        <p class="addr-name">${esc(d.shippingName)}</p>
        <p class="addr-line">${nl2br(d.shippingAddr)}<br>${esc(d.shippingPhone)}</p></div>
      <div class="glass" style="margin-bottom:0;"><p class="label">Payment Method</p>
        <p class="addr-name">${esc(d.paymentLabel)}</p>
        <p class="addr-line">${esc(d.paymentTotal)}</p></div>
    </div>

    <div class="glass help">
      <h3>Need Help with Your Order?</h3>
      <p>Our support team is here to help with any questions</p>
      <div class="help-btns"><button class="ghost">Contact Support</button><button class="solid">View Order Details</button></div>
    </div>`;
  }

  function timelineToText(tl){ return tl.map(t=>`${t.time} | ${t.title} | ${t.desc}`).join('\n'); }
  function itemsToText(items){ return items.map(it=>`${it.name} | ${it.meta} | ${it.price} | ${it.total}`).join('\n'); }
  function parseLines(text){ return text.split('\n').map(l=>l.trim()).filter(Boolean); }

  function renderAdmin(){
    const d = DATA;
    view.innerHTML = `
    <nav><span class="logo">D-wing Logistics — Admin</span><span class="links"><span>Live edit</span></span></nav>
    <div class="glass">
      <div class="label" style="margin-bottom:14px;font-size:13px;color:var(--ink);font-weight:500;">Update this shipment</div>
      <form id="adminForm">
        <div class="field-row">
          <div class="field"><label>Tracking No.</label><input id="f_trackingNo" value="${esc(d.trackingNo)}"></div>
          <div class="field"><label>Placed Date</label><input id="f_placedDate" value="${esc(d.placedDate)}"></div>
        </div>
        <div class="field-row">
          <div class="field"><label>Status Text</label><input id="f_statusText" value="${esc(d.statusText)}"></div>
          <div class="field"><label>Status Tone</label>
            <select id="f_statusTone">
              <option value="current" ${d.statusTone==='current'?'selected':''}>In progress (amber)</option>
              <option value="good" ${d.statusTone==='good'?'selected':''}>Delivered (green)</option>
            </select>
          </div>
        </div>
        <div class="field-row">
          <div class="field"><label>Current Stage</label>
            <select id="f_stepIndex">
              ${d.stepLabels.map((l,i)=>`<option value="${i}" ${i===d.currentStepIndex?'selected':''}>${esc(l)}</option>`).join('')}
            </select>
          </div>
        </div>
        <div class="field-row">
          <div class="field"><label>Carrier</label><input id="f_carrier" value="${esc(d.carrier)}"></div>
          <div class="field"><label>Estimated Delivery</label><input id="f_estimatedDelivery" value="${esc(d.estimatedDelivery)}"></div>
        </div>
        <div class="field-row">
          <div class="field"><label>Last Update</label><input id="f_lastUpdate" value="${esc(d.lastUpdate)}"></div>
          <div class="field"><label>Last Update Time</label><input id="f_lastUpdateTime" value="${esc(d.lastUpdateTime)}"></div>
        </div>
        <div class="field-row"><div class="field"><label>Last Location</label><input id="f_lastLocation" value="${esc(d.lastLocation)}"></div></div>

        <div class="field-row"><div class="field">
          <label>Timeline — one event per line: Time | Title | Description</label>
          <textarea id="f_timeline">${esc(timelineToText(d.timeline))}</textarea>
        </div></div>
        <div class="field-row"><div class="field">
          <label><input type="checkbox" id="f_tlCurrent" ${d.timelineCurrentLast?'checked':''} style="width:auto;display:inline;margin-right:6px;">Tag the last timeline event as "Current"</label>
        </div></div>

        <div class="field-row"><div class="field">
          <label>Order items — one per line: Name | Variant/Qty | Price | Total</label>
          <textarea id="f_items">${esc(itemsToText(d.items))}</textarea>
        </div></div>
        <div class="field-row">
          <div class="field"><label>Item count label</label><input id="f_itemCount" value="${esc(d.itemCount)}"></div>
          <div class="field"><label>Order total label</label><input id="f_orderTotal" value="${esc(d.orderTotal)}"></div>
        </div>

        <div class="field-row">
          <div class="field"><label>Shipping Name</label><input id="f_shippingName" value="${esc(d.shippingName)}"></div>
          <div class="field"><label>Shipping Phone</label><input id="f_shippingPhone" value="${esc(d.shippingPhone)}"></div>
        </div>
        <div class="field-row"><div class="field">
          <label>Shipping Address (new line between lines)</label>
          <textarea id="f_shippingAddr" style="min-height:60px;">${esc(d.shippingAddr)}</textarea>
        </div></div>
        <div class="field-row">
          <div class="field"><label>Payment Label</label><input id="f_paymentLabel" value="${esc(d.paymentLabel)}"></div>
          <div class="field"><label>Payment Total</label><input id="f_paymentTotal" value="${esc(d.paymentTotal)}"></div>
        </div>

        <button class="btn" type="submit" id="publishBtn">Publish Update</button>
      </form>
      <div class="admin-status" id="adminStatus"></div>
      <p class="admin-note">This publishes a new version of the live page for everyone with the link. Remove <code>#admin</code> from the URL to see the public view.</p>
      <button class="btn secondary" type="button" id="viewPublicBtn" style="margin-top:10px;">View public page</button>
    </div>`;

    document.getElementById('viewPublicBtn').onclick = () => { location.hash=''; };

    document.getElementById('adminForm').addEventListener('submit', async (e) => {
      e.preventDefault();
      const statusEl = document.getElementById('adminStatus');
      const g = id => document.getElementById(id).value;

      const newData = {
        trackingNo: g('f_trackingNo'),
        placedDate: g('f_placedDate'),
        statusText: g('f_statusText'),
        statusTone: g('f_statusTone'),
        currentStepIndex: parseInt(g('f_stepIndex'),10),
        stepLabels: DATA.stepLabels,
        stepDates: DATA.stepDates,
        carrier: g('f_carrier'),
        lastUpdate: g('f_lastUpdate'),
        lastUpdateTime: g('f_lastUpdateTime'),
        lastLocation: g('f_lastLocation'),
        estimatedDelivery: g('f_estimatedDelivery'),
        timeline: parseLines(g('f_timeline')).map(line=>{
          const parts=line.split('|').map(p=>p.trim());
          return {time:parts[0]||'',title:parts[1]||'',desc:parts[2]||''};
        }),
        timelineCurrentLast: document.getElementById('f_tlCurrent').checked,
        items: parseLines(g('f_items')).map(line=>{
          const parts=line.split('|').map(p=>p.trim());
          return {name:parts[0]||'',meta:parts[1]||'',price:parts[2]||'',total:parts[3]||''};
        }),
        itemCount: g('f_itemCount'),
        orderTotal: g('f_orderTotal'),
        shippingName: g('f_shippingName'),
        shippingAddr: g('f_shippingAddr'),
        shippingPhone: g('f_shippingPhone'),
        paymentLabel: g('f_paymentLabel'),
        paymentTotal: g('f_paymentTotal')
      };

      DATA = newData;
      dataEl.textContent = JSON.stringify(DATA, null, 2);

      if(!artifactApi){
        statusEl.textContent = 'Publishing isn\'t available in this session — open this page from claude.ai as the owner to publish.';
        statusEl.style.color = '#C1432D';
        return;
      }
      statusEl.textContent = 'Publishing…';
      statusEl.style.color = 'var(--ink-dim)';
      try{
        const fullHtml = '<!DOCTYPE html>\n' + document.documentElement.outerHTML;
        await artifactApi.publish(fullHtml);
        statusEl.textContent = 'Published — the live link is now updated for everyone.';
        statusEl.style.color = 'var(--good)';
      }catch(err){
        statusEl.textContent = 'Could not publish (' + (err && err.code ? err.code : 'error') + '). Try again.';
        statusEl.style.color = '#C1432D';
      }
    });
  }

  function route(){
    if(location.hash === '#admin') renderAdmin(); else renderTracker();
  }

  window.addEventListener('hashchange', route);
  route();

  if(window.claude && window.claude.use){
    window.claude.use('artifact').then(a => { artifactApi = a; }).catch(()=>{});
  }
})();
</script>
</body>
</html>
